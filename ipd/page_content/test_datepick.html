	<title></title>
	
	<style>

		cursor: default;

		font-family: calibri, arial, sans-serif;
		font-size: 13px;
		margin: 0;
		padding: 5px;
	}
	
	table th {
		vertical-align: top;
	}

	input {
		text-align: center;
		font-family: calibri, arial, sans-serif;
		font-size: 13px;
		background-color: white;
		border: 1px solid;
		border-color: #abadb3 #dbdfe6 #e3e9ef #e2e3ea;
		padding: 2px;
	}
	input:focus, input:hover  {
		border-color: #5794bf #b7d5ea #c7e2f1 #c5daed;
	}

	.pickerImg {
		position: absolute;
		margin-left: -16px;
		margin-top: 5px;
		cursor: pointer;
	}
	.infoBox {
		background-color: #fefdec;
		border: 1px solid #edebcd;
		padding: 6px;
		margin-bottom: 20px;
	}
